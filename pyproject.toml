[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ninaspro"
version = "0.1.0"
description = "Agentes de IA en 2 líneas para el curso IA Aplicada: Agentes de Niñas Pro"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Nicolás Falconi" }]
dependencies = [
    "openai-agents>=0.24",
    "gradio>=6",
]

[project.optional-dependencies]
pruebas = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
